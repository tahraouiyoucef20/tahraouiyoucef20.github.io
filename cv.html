<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CV</title>
    <meta name="description" content="Curriculum vitae." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0b10" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/cv.css" />
  </head>

  <body>
    <header class="cv-toolbar">
      <div class="toolbar-inner">
        <a class="toolbar-link" href="index.html">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M19 12H5m5.5-5.5L5 12l5.5 5.5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>Portfolio</span>
        </a>

        <div class="toolbar-actions">
          <span class="toolbar-hint">Choose “Save as PDF” in the print dialog</span>
          <a class="toolbar-link toolbar-original" href="assets/cv.pdf" download>Original PDF</a>
          <button class="print-btn" id="printBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Download PDF
          </button>
        </div>
      </div>
    </header>

    <main class="page" id="cv">
      <header class="cv-head">
        <div>
          <h1 id="cvName"></h1>
          <p class="cv-role" id="cvRole"></p>
          <p class="cv-contact" id="cvContact"></p>
        </div>
        <div class="cv-mono" id="cvMono" aria-hidden="true"></div>
      </header>

      <section class="cv-section">
        <h2>Profile</h2>
        <p class="cv-summary" id="cvSummary"></p>
      </section>

      <section class="cv-section">
        <h2>Experience</h2>
        <div id="cvExperience"></div>
      </section>

      <section class="cv-section">
        <h2>Projects</h2>
        <div id="cvProjects"></div>
      </section>

      <section class="cv-section cv-columns">
        <div>
          <h2>Skills</h2>
          <div id="cvSkills"></div>
        </div>
        <div>
          <h2>Education &amp; awards</h2>
          <div id="cvEdu"></div>
        </div>
      </section>

      <section class="cv-section">
        <h2>Links</h2>
        <div class="cv-links" id="cvLinks"></div>
      </section>

      <footer class="cv-foot" id="cvFoot"></footer>
    </main>

    <script src="assets/js/content.js"></script>
    <script src="assets/js/cv.js"></script>
  </body>
</html>
